<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != '/' %}{{ page.title | escape }} | {% endif %}Doudou Yu | Aging &amp; Multiomics</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Doudou Yu | Aging &amp; Multiomics">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('doudou-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = 'light';
      }
      document.documentElement.dataset.theme = theme;
    }());
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}">
  <script src="{{ '/assets/js/profile.js' | relative_url }}" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a href="{{ '/#publications' | relative_url }}">Publications</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to night mode" hidden>
      <svg class="theme-icon moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13a8.5 8.5 0 0 1-9.5-9.5A8.5 8.5 0 1 0 20.5 13Z"/></svg>
      <svg class="theme-icon sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
    </button>
  </header>
  <main id="main" class="wrap" tabindex="-1">{{ content }}</main>
  <footer class="site-footer wrap">
    <p>&copy; {{ site.time | date: '%Y' }} Doudou Yu <span class="footer-location">Seattle, WA</span></p>
    <a href="#top">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
</body>
</html>
